services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped

  web:
    image: ghcr.io/netulo/pplv2:${APP_VERSION:-stable}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
      - static_volume:/app/staticfiles
    depends_on:
      - web
    restart: unless-stopped
  
  watchtower:
    image: containrrr/watchtower
    container_name: pplv2_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro 
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-3600}
      # containrrr/watchtower's bundled Docker client defaults to an old API
      # version (1.25); newer Docker Engine daemons reject that outright
      # ("client version too old"). Pin it to what the host actually
      # supports - check `docker version --format '{{.Server.APIVersion}}'`
      # on the host if this ever needs bumping.
      - DOCKER_API_VERSION=1.40
      # E-mail przy udanej/nieudanej aktualizacji - opcjonalne. Wyłączone
      # domyślnie (puste WATCHTOWER_NOTIFICATIONS = bez zmian w zachowaniu).
      # Włącz ustawiając w .env: WATCHTOWER_NOTIFICATIONS=email oraz
      # WATCHTOWER_NOTIFICATION_EMAIL_TO=<adres>. Reszta korzysta z tego
      # samego SMTP, co reszta aplikacji.
      - WATCHTOWER_NOTIFICATIONS=${WATCHTOWER_NOTIFICATIONS:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_FROM=${DEFAULT_FROM_EMAIL:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_TO=${WATCHTOWER_NOTIFICATION_EMAIL_TO:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER=${EMAIL_HOST:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT=${EMAIL_PORT:-587}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER=${EMAIL_HOST_USER:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_DELAY=2
    profiles:
      - auto-update # Zabezpieczenie - startuje tylko, gdy tego wymusimy

volumes:
  postgres_data:
  static_volume: