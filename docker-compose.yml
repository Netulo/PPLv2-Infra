services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped

  web:
    image: ghcr.io/netulo/pplv2:${APP_VERSION:-stable}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - static_volume:/app/staticfiles
      # Bind mount (not a named volume) so BACKUP_DIR (django-dbbackup's
      # local dump target, default /app/backups) lands directly in the
      # install directory on the host - without this, local backups live
      # only in the container's writable layer and are silently lost every
      # time the container is recreated (Watchtower auto-update, a manual
      # redeploy, `docker compose up -d` after a new image), which also
      # makes DBBACKUP_CLEANUP_KEEP's "14 most recent" retention meaningless.
      - ./backups:/app/backups
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
      - static_volume:/app/staticfiles
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
    restart: unless-stopped

  # No long-running process - invoked on demand via `docker compose run --rm
  # certbot ...` for initial issuance (setup.sh's module_ssl) and renewal
  # (the cron entry registered by register_certbot_renewal_cron). It's still
  # listed as a normal service (not profile-gated) so `docker compose run`
  # works without extra flags; expect it to show as "Exited (0)" right after
  # every `docker compose up -d` - that's expected, not a crash, it just has
  # nothing to do outside of an explicit `run`.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  watchtower:
    image: containrrr/watchtower
    container_name: pplv2_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro 
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-3600}
      # containrrr/watchtower's bundled Docker client defaults to an old API
      # version (1.25); newer Docker Engine daemons reject that outright
      # ("client version too old"). Pin it to what the host actually
      # supports - check `docker version --format '{{.Server.APIVersion}}'`
      # on the host if this ever needs bumping.
      - DOCKER_API_VERSION=1.40
      # E-mail przy udanej/nieudanej aktualizacji - opcjonalne. Wyłączone
      # domyślnie (puste WATCHTOWER_NOTIFICATIONS = bez zmian w zachowaniu).
      # Włącz ustawiając w .env: WATCHTOWER_NOTIFICATIONS=email oraz
      # WATCHTOWER_NOTIFICATION_EMAIL_TO=<adres>. Reszta korzysta z tego
      # samego SMTP, co reszta aplikacji.
      - WATCHTOWER_NOTIFICATIONS=${WATCHTOWER_NOTIFICATIONS:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_FROM=${DEFAULT_FROM_EMAIL:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_TO=${WATCHTOWER_NOTIFICATION_EMAIL_TO:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER=${EMAIL_HOST:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT=${EMAIL_PORT:-587}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER=${EMAIL_HOST_USER:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - WATCHTOWER_NOTIFICATION_EMAIL_DELAY=2
    profiles:
      - auto-update # Zabezpieczenie - startuje tylko, gdy tego wymusimy

volumes:
  postgres_data:
  static_volume:
  certbot_conf:
  certbot_www: